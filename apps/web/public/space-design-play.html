<!doctype html>
<!-- 设计 play host. A playing artboard loads this page in an opaque-origin sandbox and sends it one
     document (boardSrcdoc in designDocument.ts, which carries the artboard's own policy). A srcdoc
     frame would inherit the app's script-src 'self' and never run the artboard's scripts. This
     policy only has to allow what the artboard's own policy allows; that one still applies. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: blob: https://fonts.gstatic.com; img-src data: blob: https:; media-src data: blob: https:; connect-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>设计</title>
    <script>
      (function () {
        var protocol = "moss-design-play-v1";
        var params = new URLSearchParams(location.hash.slice(1));
        var nonce = params.get("nonce");
        var parentOrigin = params.get("parentOrigin");
        if (
          params.get("protocol") !== protocol ||
          !nonce ||
          !/^[a-zA-Z0-9-]{16,128}$/.test(nonce) ||
          !parentOrigin ||
          parent === window
        )
          return;
        var host = parent;
        var targetOrigin = parentOrigin === "null" ? "*" : parentOrigin;
        function receive(event) {
          if (event.source !== host || event.origin !== parentOrigin) return;
          var data = event.data;
          if (
            !data ||
            data.protocol !== protocol ||
            data.nonce !== nonce ||
            data.kind !== "document" ||
            typeof data.html !== "string" ||
            data.html.length > 6000000
          )
            return;
          window.removeEventListener("message", receive);
          document.open();
          document.write(data.html);
          document.close();
        }
        window.addEventListener("message", receive);
        host.postMessage({ protocol: protocol, nonce: nonce, kind: "ready" }, targetOrigin);
      })();
    </script>
  </head>
  <body></body>
</html>
