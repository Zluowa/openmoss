# Generated by scripts/public-mirror from .github/workflows/windows-upgrade-host-capability.yml in the private repository.
# Change that file, not this one: each sync overwrites it.
name: Windows upgrade host evidence only
on:
  push:
    branches:
      - ci/nsis-host-*
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  host_evidence:
    name: Collect host facts (upgrade remains unverified)
    if: github.repository == 'Zluowa/openmoss' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/nsis-host-')))
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed capability source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - name: Collect sanitized host evidence without fixtures or installation
        shell: pwsh
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'Zluowa/openmoss' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:ImageOS -cne 'win22') {
            throw 'Only the public hosted windows-2022 runner is allowed.'
          }
          if ($env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -and ($env:GITHUB_EVENT_NAME -cne 'push' -or -not $env:GITHUB_REF.StartsWith('refs/heads/ci/nsis-host-'))) {
            throw 'Only explicit host evidence dispatch or the dedicated candidate branch may run.'
          }
          $evidence = Join-Path $env:RUNNER_TEMP 'moss-host-evidence'
          New-Item -ItemType Directory -Path $evidence -ErrorAction Stop | Out-Null
          $probeRoot = Join-Path $env:RUNNER_TEMP 'moss-upgrade-host-only'
          node scripts/windows-upgrade/cli.mjs --mode host --root $probeRoot 1> (Join-Path $evidence 'report.json') 2> (Join-Path $evidence 'failure.json')
          if ($LASTEXITCODE -ne 0) { throw 'Host evidence collection failed; upgrade remains unverified.' }
          Write-Output 'Host evidence collected only. No fixture, install or upgrade acceptance was performed.'
      - name: Upload sanitized host JSON only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-host-evidence-only
          path: |
            ${{ runner.temp }}/moss-host-evidence/report.json
            ${{ runner.temp }}/moss-host-evidence/failure.json
          if-no-files-found: error
          retention-days: 7
