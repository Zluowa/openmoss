# Generated by scripts/public-mirror from .github/workflows/ci.yml in the private repository.
# Change that file, not this one: each sync overwrites it.
name: CI
on:
  pull_request: {}
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  static:
    name: Static Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - parallel:
          - name: Verify Windows runtime boundary
            run: bun run windows-runtime:check
          - name: Format
            run: bun run fmt:check
          - name: Lint
            run: bun run lint
  static-typecheck:
    name: Static Checks (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Typecheck
        run: bun run typecheck
  unit_tests:
    name: Unit Tests (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: web-desktop
            filters: --filter=@moss/web --filter=@moss/desktop
            test_args: ""
          - lane: server-1
            filters: --filter=@moss/cli
            test_args: -- --shard=1/3
          - lane: server-2
            filters: --filter=@moss/cli
            test_args: -- --shard=2/3
          - lane: server-3
            filters: --filter=@moss/cli
            test_args: -- --shard=3/3
          - lane: shared
            filters: --filter=!@moss/web --filter=!@moss/desktop --filter=!@moss/cli
            test_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo-cache: "false"
      - name: Verify Linux terminal PTY native dependency
        if: ${{ startsWith(matrix.lane, 'server-') }}
        run: node scripts/node-pty-smoke.mjs
      - name: Visual parity packages cache key
        if: ${{ matrix.lane == 'shared' }}
        id: visual-parity-key
        run: echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Restore visual parity packages
        if: ${{ matrix.lane == 'shared' }}
        id: visual-parity-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/visual-parity-debs
          key: ${{ runner.os }}-visual-parity-${{ steps.visual-parity-key.outputs.image }}-ffmpeg-x11-xserver-utils-v1
      - name: Install visual parity runtime
        if: ${{ matrix.lane == 'shared' }}
        timeout-minutes: 8
        run: |
          debs="$HOME/visual-parity-debs"
          if compgen -G "$debs/*.deb" > /dev/null && sudo dpkg -i "$debs"/*.deb > /dev/null; then
            echo "Installed $(ls "$debs"/*.deb | wc -l) cached packages without network"
            exit 0
          fi
          rm -rf "$debs" && mkdir -p "$debs"
          timeout 180 sudo apt-get -o Acquire::Retries=3 update > /dev/null \
            || { echo "::error::apt-get update failed or took over 180 s"; exit 1; }
          # One connection to this mirror has delivered 20-250 KB/s, so the ~50 MB set downloads over 16 at
          # once. --print-uris lists 'URL' FILE SIZE ALGO:HASH for every package the image still lacks; each
          # file is checked against that hash before dpkg sees it.
          sudo apt-get --print-uris -qq install --yes --no-install-recommends ffmpeg x11-xserver-utils \
            | sed -nE "s/^'([^']+)' ([^ ]+) [0-9]+ ([A-Za-z0-9]+):([0-9a-f]+)$/\1 \2 \3 \4/p" \
            > "$RUNNER_TEMP/visual-parity.list"
          count=$(wc -l < "$RUNNER_TEMP/visual-parity.list")
          [ "$count" -gt 0 ] || { echo "::error::apt listed no packages to download"; exit 1; }
          started=$(date +%s)
          # Each line: URL FILE ALGO HASH DIR ($1..$5; $0 is the placeholder "_").
          xargs -P 16 -L 1 bash -c 'cd "$5" && curl -fsSL --retry 4 --retry-delay 2 --max-time 300 -o "$2" "$1" \
            && echo "$4  $2" | "${3,,}sum" -c --quiet - || { echo "download or hash check failed: $2"; exit 255; }' \
            _ < <(sed "s|\$| $debs|" "$RUNNER_TEMP/visual-parity.list") \
            || { echo "::error::visual parity packages: a download failed"; exit 1; }
          echo "Downloaded $count packages ($(du -sh "$debs" | cut -f1)) in $(( $(date +%s) - started )) s"
          sudo dpkg -i "$debs"/*.deb > /dev/null
      - name: Save visual parity packages
        if: ${{ matrix.lane == 'shared' && steps.visual-parity-cache.outputs.cache-hit != 'true' }}
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/visual-parity-debs
          key: ${{ runner.os }}-visual-parity-${{ steps.visual-parity-key.outputs.image }}-ffmpeg-x11-xserver-utils-v1
      - name: Restore Playwright browsers for the shared lane
        if: ${{ matrix.lane == 'shared' }}
        id: shared-playwright-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install browser test runtime
        if: ${{ matrix.lane == 'shared' }}
        timeout-minutes: 10
        run: |
          cd apps/web
          for attempt in 1 2; do
            timeout 240 ./node_modules/.bin/playwright install chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed or took over 240 s"
          done
          exit 1
      - name: Test
        timeout-minutes: 15
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          MOSS_TEST_PROGRESS_FILE: ${{ runner.temp }}/moss-unit-progress.tsv
          MOSS_TEST_FILE_LIMIT_SECONDS: "600"
        run: |
          # Keep the full transcript downloadable without overwhelming job-log
          # clients. Preserve the original test exit code and show its summary.
          set +e
          bun run test ${{ matrix.filters }} --log-order=stream ${{ matrix.test_args }} > "$RUNNER_TEMP/moss-unit-tests.log" 2>&1
          test_status=$?
          tail -n 250 "$RUNNER_TEMP/moss-unit-tests.log"
          exit "$test_status"
      - name: Summarize failed tests
        if: failure()
        run: node tools/test-quarantine/failures.ts "$RUNNER_TEMP/moss-unit-tests.log" --platform linux --progress "$RUNNER_TEMP/moss-unit-progress.tsv" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload unit test transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit-test-transcript-${{ matrix.lane }}
          path: ${{ runner.temp }}/moss-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7
  unit:
    name: Unit Tests
    needs: unit_tests
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Aggregate unit results
        env:
          UNIT: ${{ needs.unit_tests.result }}
        run: |
          if [ "$UNIT" != "success" ]; then
            echo "unit_tests=$UNIT"
            exit 1
          fi
  browser:
    name: Browser Tests (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: 1/4
            project: components
            file_shard: --shard=1/4
            case_partition: 1/1
          - lane: 2/4
            project: components
            file_shard: --shard=2/4
            case_partition: 1/1
          - lane: 3/4
            project: components
            file_shard: --shard=3/4
            case_partition: 1/1
          - lane: 4/4
            project: components
            file_shard: --shard=4/4
            case_partition: 1/1
          - lane: chat 1/4
            project: chat
            file_shard: ""
            case_partition: 1/4
          - lane: chat 2/4
            project: chat
            file_shard: ""
            case_partition: 2/4
          - lane: chat 3/4
            project: chat
            file_shard: ""
            case_partition: 3/4
          - lane: chat 4/4
            project: chat
            file_shard: ""
            case_partition: 4/4
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Record hosted component browser initial disk space
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.project == 'components' }}
        run: df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo-cache: "false"
      - name: Observe hosted component browser workspace disk space
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.project == 'components' }}
        env:
          MOSS_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOSS_CI_BROWSER_PROJECT: ${{ matrix.project }}
          MOSS_CI_BROWSER_LANE: ${{ matrix.lane }}
        run: node scripts/ci-browser-disk.ts observe after-workspace-setup
      - name: Restore Playwright browsers for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Cache Playwright browsers on main
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd apps/web
          # One retry: a stalled CDN download fails the attempt, not the job.
          for attempt in 1 2; do
            timeout 360 ./node_modules/.bin/playwright install chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed or took over 360 s"
          done
          exit 1
      - name: Prepare hosted component browser phase caches
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.project == 'components' }}
        env:
          MOSS_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOSS_CI_BROWSER_PROJECT: ${{ matrix.project }}
          MOSS_CI_BROWSER_LANE: ${{ matrix.lane }}
        run: node scripts/ci-browser-disk.ts initialize
      - name: Browser test (stable)
        timeout-minutes: 20
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          MOSS_BROWSER_CASE_PARTITION: ${{ matrix.case_partition }}
          MOSS_BROWSER_VITE_CACHE_DIR: ${{ env.MOSS_BROWSER_STABLE_CACHE_DIR }}
        run: bun run --cwd apps/web test:browser:ci --project=${{ matrix.project }} ${{ matrix.file_shard }}
      - name: Release completed stable browser phase cache
        if: ${{ success() && runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.project == 'components' }}
        env:
          MOSS_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOSS_CI_BROWSER_PROJECT: ${{ matrix.project }}
          MOSS_CI_BROWSER_LANE: ${{ matrix.lane }}
        run: node scripts/ci-browser-disk.ts release-stable
      - name: Browser test (compiled transcript render scope)
        if: ${{ matrix.project == 'components' && matrix.lane == '1/4' }}
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          MOSS_BROWSER_VITE_CACHE_DIR: ${{ env.MOSS_BROWSER_COMPILER_CACHE_DIR }}
        run: bun run --cwd apps/web test:browser:compiler
      - name: Release completed compiler browser phase cache
        if: ${{ success() && runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.project == 'components' && matrix.lane == '1/4' }}
        env:
          MOSS_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOSS_CI_BROWSER_PROJECT: ${{ matrix.project }}
          MOSS_CI_BROWSER_LANE: ${{ matrix.lane }}
        run: node scripts/ci-browser-disk.ts release-compiler
      - name: Browser test (Linux geometry quarantine)
        if: ${{ matrix.project == 'components' && matrix.lane == '1/4' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          MOSS_BROWSER_VITE_CACHE_DIR: ${{ env.MOSS_BROWSER_GEOMETRY_CACHE_DIR }}
        run: bun run --cwd apps/web test:browser:geometry
      - name: Observe hosted component browser final disk space
        if: ${{ always() && runner.os == 'Linux' && runner.environment == 'github-hosted' && matrix.project == 'components' }}
        env:
          MOSS_CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          MOSS_CI_BROWSER_PROJECT: ${{ matrix.project }}
          MOSS_CI_BROWSER_LANE: ${{ matrix.lane }}
        run: node scripts/ci-browser-disk.ts observe after-browser-attempt
  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: package.json
      - name: Install dependencies
        timeout-minutes: 10
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify Windows terminal PTY native dependency exits cleanly
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "node" -ArgumentList @("scripts/node-pty-smoke.mjs") -NoNewWindow -PassThru
          if (-not $process.WaitForExit(15000)) {
            & taskkill.exe /PID $process.Id /T /F | Out-Null
            throw "node-pty smoke did not exit within 15 seconds."
          }
          if ($process.ExitCode -ne 0) {
            throw "node-pty smoke exited with code $($process.ExitCode)."
          }
      - name: Verify Windows terminal PTY native dependency under Bun
        run: bun scripts/node-pty-smoke.mjs
      - name: Verify Windows runtime boundary
        run: bun run windows-runtime:check
      - name: Install pinned LLVM for the Windows job launcher
        uses: ./.github/actions/setup-moss-llvm
      - name: Build the Windows job launcher (byte-pinned)
        run: node apps/server/scripts/build-windows-job-launcher.mjs
      - name: Test the Windows job launcher and contained Codex text generation
        run: bun run --cwd apps/server test src/platform/windowsKillOnCloseJob.test.ts src/git/Layers/CodexTextGeneration.windowsJob.test.ts src/git/Layers/CodexTextGeneration.test.ts
      - name: Test shared platform runtime
        run: bun run --cwd packages/shared test src/platformProcess.test.ts src/processRuntime.test.ts src/filesystemPlatform.test.ts src/platformEnvironment.test.ts
      - name: Test Windows process planning
        run: bun run --cwd packages/shared test src/windowsProcess.test.ts
      - name: Test Effect Windows process spawn
        run: bun run --cwd apps/server test src/windowsProcessEffect.test.ts
      - name: Test Windows managed-home authority, migration, and cleanup
        run: bun run --cwd apps/server test src/account/mossManagedHomeAuthority.test.ts src/codexProcessEnv.managedWindows.test.ts src/account/mossCodexAccountCleanup.test.ts src/provider/Layers/ProviderService.managedHome.test.ts src/terminal/providerTerminalProfiles.test.ts src/wsRpc.settingsBoundary.test.ts
      - name: Verify Windows managed plugins with the desktop-pinned native CLI
        shell: pwsh
        run: |
          $codexVersion = (Get-Content scripts/desktop-stage-lock/package.json -Raw | ConvertFrom-Json).dependencies.'@openai/codex'
          $cliPrefix = Join-Path $env:RUNNER_TEMP "moss-plugin-smoke-cli"
          npm install --prefix $cliPrefix --no-audit --no-fund "@openai/codex@$codexVersion"
          if ($LASTEXITCODE -ne 0) { throw "Pinned Codex installation failed." }
          $env:MOSS_PLUGIN_SMOKE_CLI_PREFIX = $cliPrefix
          $codexBinary = bun -e 'import path from "node:path"; import { resolveBundledCodexTargets, resolveBundledCodexRuntime } from "./scripts/lib/bundled-codex-runtime.ts"; const target = resolveBundledCodexTargets({ platform: "win", arch: "x64" })[0]; const runtime = resolveBundledCodexRuntime({ stageAppDir: process.env.MOSS_PLUGIN_SMOKE_CLI_PREFIX, target }); console.log(path.join(runtime.sourceDir, "bin", target.executable));'
          if ($LASTEXITCODE -ne 0) { throw "Pinned Codex runtime validation failed." }
          bun scripts/moss-managed-plugin-smoke.ts --codex $codexBinary --output (Join-Path $env:RUNNER_TEMP "moss-managed-plugin-smoke.json")
          if ($LASTEXITCODE -ne 0) { throw "Windows managed plugin lifecycle failed." }
      - name: Test formal evidence actual Win32 fail-closed guard
        run: bun run --cwd scripts test lib/formal-visual-evidence-files.test.ts -t "actual win32 runtime"
      - name: Test Windows ASAR native payload audit
        run: bun run --cwd scripts test lib/windows-native-payload-audit.test.mjs -t "uses platform-native ASAR lookup paths for nested scoped packages"
      - name: Test Windows desktop backend shutdown
        run: bun run --cwd apps/desktop test:vitest src/backendShutdown.windows.integration.test.ts
      - name: Test migration recovery marker
        run: bun run --cwd packages/shared test src/migrationRecovery.test.ts
      - name: Test desktop migration recovery
        run: bun run --cwd apps/desktop test:vitest src/desktopMigrationRecovery.test.ts
      - name: Test migration backup and restore
        run: bun run --cwd apps/server test src/persistence/MigrationBackup.test.ts
      - name: Test migration replay
        run: bun run --cwd apps/server test src/persistence/Migrations/MigrationReplay.test.ts
  migration_lineage:
    name: Migration Lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: package.json
      - name: Verify released migration lineage
        run: node scripts/check-migration-lineage.ts
