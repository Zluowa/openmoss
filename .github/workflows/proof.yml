# Generated by scripts/public-mirror from .github/workflows/proof.yml in the private repository.
# Change that file, not this one: each sync overwrites it.
name: Proof Screenshots
on:
  push:
    branches:
      - main
      - ci/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  proof:
    name: Proof Screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 3
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Restore Playwright browsers
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
      - name: Install browser runtime
        timeout-minutes: 8
        run: |
          cd apps/web
          for attempt in 1 2; do
            timeout 200 ./node_modules/.bin/playwright install chromium && exit 0
            echo "::warning::playwright install attempt $attempt failed or took over 200 s"
          done
          exit 1
      - name: Restore the Chinese font
        id: font
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/fonts/moss-cjk
          key: ${{ runner.os }}-fonts-noto-cjk-v1
      - name: Install the Chinese font
        if: ${{ steps.font.outputs.cache-hit != 'true' }}
        timeout-minutes: 18
        run: |
          for attempt in 1 2 3; do
            sudo apt-get update -qq -o Acquire::Retries=3 \
              && sudo apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 fonts-noto-cjk \
              && break
            echo "::warning::font install attempt $attempt failed"
            sleep 15
          done
          # Copy the sans files the package really installed (fonts-noto-cjk ships Regular and
          # Bold; other weights are in fonts-noto-cjk-extra, which is not installed).
          mkdir -p ~/.local/share/fonts/moss-cjk
          dpkg -L fonts-noto-cjk | grep -E '/NotoSansCJK-[A-Za-z]+\.ttc$' | while read -r file; do
            cp "$file" ~/.local/share/fonts/moss-cjk/
          done
          if ! ls ~/.local/share/fonts/moss-cjk/*.ttc >/dev/null 2>&1; then
            echo "::error::fonts-noto-cjk installed no NotoSansCJK file to cache"
            exit 1
          fi
          ls -la ~/.local/share/fonts/moss-cjk
      - name: Use the Chinese font
        run: |
          fc-cache -f ~/.local/share/fonts
          fc-list :lang=zh family | grep -q . || { echo "::error::no Chinese font installed"; exit 1; }
          fc-list :lang=zh family | head -3
      - name: Build the web client
        timeout-minutes: 8
        run: bun run --cwd apps/web build
      - name: Take the screenshots
        timeout-minutes: 8
        run: node apps/web/scripts/proof-shots.mjs shoot --out "$RUNNER_TEMP/proof/shots"
      - name: Upload the screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-shots
          path: ${{ runner.temp }}/proof/shots
          if-no-files-found: warn
          retention-days: 14
      - name: Compare with the parent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=""
          for ancestor in HEAD~1 HEAD~2; do
            parent=$(git rev-parse --verify --quiet "$ancestor") || continue
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow proof.yml --commit "$parent" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] && break
          done
          if [ -z "$run" ]; then
            echo "### Proof screenshots: no finished run of a parent to compare with" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Compared with run $run of ${parent:0:9}" >> "$GITHUB_STEP_SUMMARY"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n proof-shots -D "$RUNNER_TEMP/proof/base"
          node apps/web/scripts/proof-shots.mjs compare --base "$RUNNER_TEMP/proof/base" --head "$RUNNER_TEMP/proof/shots" --out "$RUNNER_TEMP/proof/diff"
          cat "$RUNNER_TEMP/proof/diff/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the comparison
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: proof-diff
          path: ${{ runner.temp }}/proof/diff
          if-no-files-found: ignore
          retention-days: 14
