name: Setup workspace
description: Shared tool setup, dependency install, and caches for Moss CI jobs

inputs:
  scope:
    description: Dependency install scope (full, static, or runtime).
    default: "full"
  electron:
    description: Install the Electron runtime binary.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: package.json

    - name: Restore Bun install for pull requests
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-
    # Phase 1c/3: node_modules survives across jobs keyed on the lockfile.
    # bun install --frozen-lockfile still runs below (correctness), but a warm
    # cache turns resolve + download into link. The key is scoped by the
    # electron input: Install Electron test runtime extracts the binary into
    # apps/desktop/node_modules/electron/dist INSIDE node_modules, so the
    # electron lane's tree differs from other lanes and must not share a blob.
    - name: Cache node_modules
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        # Bun's lockfile records patch paths, not their content. Vite's cached
        # dependency bundles must not cross a patch revision either.
        key: ${{ runner.os }}-bun-node-modules-electron-${{ inputs.electron }}-${{ hashFiles('patches/*.patch') }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-node-modules-electron-${{ inputs.electron }}-${{ hashFiles('patches/*.patch') }}-

    # Phase 3h: persist Turbo's local cache store so cacheable build outputs
    # survive across jobs. Turbo verifies its own fingerprints on hit, so a
    # broad key is safe: stale entries simply miss inside turbo. test and
    # typecheck stay cache:false in turbo.json (inputs not proven airtight).
    # GitHub caches are immutable: each job/shard saves new results per commit
    # and restores its previous snapshot before falling back to other lanes.
    - name: Cache Turbo outputs
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-
          ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-
          ${{ runner.os }}-turbo-

    - name: Cache Bun install on main
      if: ${{ github.event_name != 'pull_request' }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}-

    - name: Restore Electron runtime for pull requests
      if: ${{ github.event_name == 'pull_request' && (inputs.electron == 'true') }}
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}

    - name: Cache Electron runtime on main
      if: ${{ github.event_name != 'pull_request' && (inputs.electron == 'true') }}
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        WORKSPACE_SCOPE: ${{ inputs.scope }}
      run: |
        # Hosted Windows checks out on D:, while Bun's default home cache is on C:.
        # Match the measured setup so package hardlinks can stay on one volume.
        if [ "$RUNNER_OS" = "Windows" ]; then
          export BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-install-cache"
          echo "Bun install cache: $BUN_INSTALL_CACHE_DIR"
        fi
        # Root postinstall patches each physical TypeScript compiler once.
        # Keep dependency lifecycle scripts bounded independently of that patch.
        case "$WORKSPACE_SCOPE" in
          full) bun install --frozen-lockfile --concurrent-scripts=1 ;;
          static) bun install --frozen-lockfile --filter './' --filter '@synara/scripts' --concurrent-scripts=1 ;;
          runtime) bun install --frozen-lockfile --filter '!@synara/marketing' --concurrent-scripts=1 ;;
          *) echo "Unknown workspace installation scope: $WORKSPACE_SCOPE" >&2; exit 1 ;;
        esac

    - name: Install Electron test runtime
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if node apps/desktop/node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
