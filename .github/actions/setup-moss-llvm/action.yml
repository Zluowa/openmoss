name: Install pinned LLVM for moss-job-launch
description: >-
  Download the LLVM release named in apps/server/native/moss-job-launch/moss-job-launch.pin.json,
  verify its sha256, keep only what the launcher build needs (clang, lld-link, llvm-dlltool and
  clang's own headers, about 210 MB), cache that, and point MOSS_WINDOWS_LLVM_BIN at it. Only that
  version produces the pinned bytes of moss-job-launch.exe; build-windows-job-launcher.mjs refuses
  any other.
runs:
  using: composite
  steps:
    - name: Read the LLVM pin
      id: pin
      shell: bash
      run: |
        node --input-type=module <<'NODE'
        import { appendFileSync, readFileSync } from 'node:fs';
        const pin = JSON.parse(readFileSync('apps/server/native/moss-job-launch/moss-job-launch.pin.json', 'utf8'));
        const { version, archive, archiveSha256 } = pin.llvm;
        if (!/^\d+\.\d+\.\d+$/.test(version) || !/^[0-9a-f]{64}$/.test(archiveSha256)) throw new Error('Invalid LLVM pin.');
        appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nmajor=${version.split('.')[0]}\narchive=${archive}\nsha256=${archiveSha256}\n`);
        NODE

    - name: Restore pinned LLVM tools
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ runner.temp }}/moss-llvm-${{ steps.pin.outputs.version }}
        key: moss-llvm-tools-${{ runner.os }}-${{ steps.pin.outputs.sha256 }}

    - name: Download, verify and unpack the pinned LLVM tools
      if: ${{ steps.cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        LLVM_VERSION: ${{ steps.pin.outputs.version }}
        LLVM_MAJOR: ${{ steps.pin.outputs.major }}
        LLVM_ARCHIVE: ${{ steps.pin.outputs.archive }}
        LLVM_SHA256: ${{ steps.pin.outputs.sha256 }}
        LLVM_DIR: ${{ runner.temp }}/moss-llvm-${{ steps.pin.outputs.version }}
      run: |
        set -euo pipefail
        command -v zstd >/dev/null || { echo "zstd is required to unpack the LLVM archive." >&2; exit 1; }
        started=$SECONDS
        temp=$(cygpath -u "$RUNNER_TEMP")
        out=$(cygpath -u "$LLVM_DIR")
        archive="$temp/$LLVM_ARCHIVE"
        curl -fsSL --retry 3 -o "$archive" \
          "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/$LLVM_ARCHIVE"
        echo "$LLVM_SHA256  $archive" | sha256sum -c -
        unpacked="$temp/moss-llvm-unpacked"
        rm -rf "$unpacked" && mkdir -p "$unpacked"
        # Only the members the build needs; a member the archive stores under another name
        # (lld-link as lld, llvm-dlltool as llvm-ar) is filled in below.
        zstd -dc "$archive" | tar -xf - -C "$unpacked" --strip-components=1 --wildcards \
          '*/bin/clang.exe' '*/bin/lld.exe' '*/bin/lld-link.exe' \
          '*/bin/llvm-ar.exe' '*/bin/llvm-dlltool.exe' "*/lib/clang/$LLVM_MAJOR/include/*" || true
        rm -f "$archive"
        rm -rf "$out" && mkdir -p "$out/bin" "$out/lib/clang/$LLVM_MAJOR"
        cp "$unpacked/bin/clang.exe" "$out/bin/clang.exe"
        # The tools pick their mode from their own file name, so a copy under the expected
        # name works the same as the archive's own entry.
        for pair in "lld-link.exe lld.exe" "llvm-dlltool.exe llvm-ar.exe"; do
          set -- $pair
          if [ -s "$unpacked/bin/$1" ]; then cp "$unpacked/bin/$1" "$out/bin/$1"; else cp "$unpacked/bin/$2" "$out/bin/$1"; fi
        done
        cp -R "$unpacked/lib/clang/$LLVM_MAJOR/include" "$out/lib/clang/$LLVM_MAJOR/include"
        rm -rf "$unpacked"
        "$out/bin/clang.exe" --version | head -n 1
        du -sh "$out"
        echo "Pinned LLVM tools ready in $((SECONDS - started)) s."

    - name: Use pinned LLVM tools
      shell: bash
      env:
        LLVM_DIR: ${{ runner.temp }}/moss-llvm-${{ steps.pin.outputs.version }}
      run: echo "MOSS_WINDOWS_LLVM_BIN=$LLVM_DIR/bin" >> "$GITHUB_ENV"
